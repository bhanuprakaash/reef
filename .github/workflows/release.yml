name: release

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go test ./...
        # The worktree tests compare paths, and the default TMPDIR under /var is a symlink.
        env:
          TMPDIR: ${{ runner.temp }}
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm test
        working-directory: web

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-14
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm version 0.1.${{ github.run_number }} --no-git-tag-version
        working-directory: desktop
      - run: npm ci
        working-directory: desktop
      - run: npm run dist:mac
        working-directory: desktop
      - run: >
          gh release create v0.1.${{ github.run_number }} desktop/dist/Reef-mac-arm64.zip
          --title "Reef 0.1.${{ github.run_number }}" --generate-notes --latest
